services:
  - type: web
    name: arleelines-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://htcqralquxegsqgjlxwr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BITRIX24_WEBHOOK
        sync: false
      - key: JWT_SECRET
        generateValue: true
